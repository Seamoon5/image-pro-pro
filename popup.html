<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Pro</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app page">
    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M4 8.5V7a2 2 0 0 1 2-2h2l1.2-1.4A1.5 1.5 0 0 1 10.3 3h3.4a1.5 1.5 0 0 1 1.1.6L16 5h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1.5"></path>
            <path d="M2 12h3"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Image Pro</span>
          <span class="brand-sub" id="tier-label">Free</span>
        </div>
        <span id="premium-badge" class="premium-badge" style="display:none">Premium</span>
      </div>
      <div class="topbar-right">
        <button type="button" class="icon-btn" id="theme-toggle" title="Switch theme" aria-label="Switch theme">
          <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1.51-1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button type="button" class="icon-btn" id="sidepanel-btn" title="Open side panel" aria-label="Open side panel" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        </button>
        <button type="button" class="icon-btn" id="license-btn" title="Unlock Premium" aria-label="Unlock Premium">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
      </div>
    </header>

    <!-- Action row -->
    <section class="action-row">
      <div class="count-block">
        <span id="page-count" class="count-num">0</span>
        <span class="count-label" id="page-count-label">images found</span>
      </div>
      <div class="action-buttons">
        <button type="button" class="btn btn-ghost btn-icon" id="scan-all-tabs-btn" title="Scan all open tabs" aria-label="Scan all open tabs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
        </button>
        <button type="button" class="btn btn-primary" id="download-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
          Download <span id="download-count">0</span>
        </button>
      </div>
    </section>

    <!-- Controls -->
    <section class="controls">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
          <input type="search" id="search-input" placeholder="Filter by name or URL" autocomplete="off" spellcheck="false">
        </div>
        <select id="sort-select" class="select" title="Sort">
          <option value="default">Page order</option>
          <option value="largest">Largest first</option>
          <option value="smallest">Smallest first</option>
          <option value="name">Name A–Z</option>
        </select>
        <button type="button" class="icon-btn" id="filters-toggle" title="Filters" aria-label="Filters" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18"></path><path d="M6 12h12"></path><path d="M10 19h4"></path></svg>
        </button>
      </div>

      <div class="chips" id="format-chips">
        <button type="button" class="chip active" data-format="all">All</button>
        <button type="button" class="chip" data-format="jpg">JPG</button>
        <button type="button" class="chip" data-format="png">PNG</button>
        <button type="button" class="chip" data-format="webp">WebP</button>
        <button type="button" class="chip" data-format="avif">AVIF</button>
        <button type="button" class="chip" data-format="gif">GIF</button>
        <button type="button" class="chip" data-format="svg">SVG</button>
      </div>

      <div class="advanced" id="advanced-filters" hidden>
        <div class="filters-row">
          <label class="mini-field">Min W <input type="number" id="min-width" value="0" min="0" max="9999" inputmode="numeric"></label>
          <label class="mini-field">Min H <input type="number" id="min-height" value="0" min="0" max="9999" inputmode="numeric"></label>
          <label class="switch"><input type="checkbox" id="only-links-checkbox"><span class="switch-track"></span> Links only</label>
          <span class="spacer"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="apply-filters-btn">Apply</button>
        </div>
        <div class="input-row">
          <input type="text" id="folder-name" placeholder="Download folder (optional)" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </section>

    <!-- Selection bar -->
    <div class="selection-bar">
      <button type="button" class="link-btn" id="select-all-btn">Select all</button>
      <button type="button" class="link-btn" id="deselect-all-btn">Clear</button>
      <span class="spacer"></span>
      <span class="sel-count"><strong id="selected-count">0</strong> selected</span>
    </div>

    <!-- Gallery -->
    <div class="gallery-wrap" id="gallery-wrap">
      <div class="gallery" id="image-gallery"></div>
    </div>

    <!-- Status -->
    <footer class="statusbar">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-message">Scanning this page…</span>
    </footer>
  </div>

  <!-- Lightbox (preview) -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-top">
      <div class="lb-meta">
        <span class="lb-title" id="lb-title">Preview</span>
        <span class="lb-sub" id="lb-sub"></span>
      </div>
      <button type="button" class="lb-close" id="lb-close" aria-label="Close preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="lb-stage">
      <button type="button" class="lb-nav prev" id="lb-prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
      <img id="lb-img" alt="">
      <button type="button" class="lb-nav next" id="lb-next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
    </div>
    <div class="lb-actions">
      <button type="button" class="btn btn-primary btn-full" id="lb-download">Download image</button>
      <button type="button" class="btn btn-ghost btn-full" id="lb-copy">Copy URL</button>
      <button type="button" class="btn btn-ghost btn-full" id="lb-open">Open in new tab</button>
      <button type="button" class="btn btn-outline btn-full" id="lb-edit" style="display:none">Edit image (Premium)</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
