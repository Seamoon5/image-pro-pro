<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Pro — Side Panel</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app page">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M4 8.5V7a2 2 0 0 1 2-2h2l1.2-1.4A1.5 1.5 0 0 1 10.3 3h3.4a1.5 1.5 0 0 1 1.1.6L16 5h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1.5"></path>
            <path d="M2 12h3"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Image Pro</span>
          <span class="brand-sub" id="sp-tier-label">Free</span>
        </div>
        <span id="sp-premium-badge" class="premium-badge" style="display:none">Premium</span>
      </div>
      <div class="topbar-right">
        <button type="button" class="icon-btn" id="sp-settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1.51-1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <section class="section">
      <div class="section-title">Scan this page</div>
      <div class="action-row">
        <div class="count-block">
          <span id="sp-count" class="count-num">0</span>
          <span class="count-label">images</span>
        </div>
        <div class="action-buttons">
          <button type="button" class="btn btn-primary btn-full" id="sp-scan">Scan page</button>
        </div>
      </div>
    </section>

    <section class="section" style="flex:1; display:flex; flex-direction:column">
      <div class="section-title">Results</div>
      <div class="controls" style="padding:0 16px; background:transparent; border-bottom:none">
        <div class="search-row" style="gap:8px">
          <div class="search-box" style="flex:1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
            <input type="search" id="sp-search" placeholder="Filter…" autocomplete="off" spellcheck="false">
          </div>
          <select id="sp-sort" class="select">
            <option value="default">Page order</option>
            <option value="largest">Largest first</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
      </div>
      <div class="gallery-wrap" id="sp-gallery-wrap" style="flex:1; overflow-y:auto; padding:0 16px 16px">
        <div class="gallery" id="sp-gallery"></div>
      </div>
      <footer class="statusbar">
        <span class="status-dot" id="sp-status-dot"></span>
        <span class="status-text" id="sp-status">Ready</span>
      </footer>
    </section>

    <div class="toast" id="sp-toast" role="status" aria-live="polite"></div>

    <div class="premium-upsell" id="sp-upsell" hidden style="padding:16px;background:var(--premium-soft);border:1px solid var(--premium-line);border-radius:var(--radius);margin:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="premium-badge">Premium</span>
        <span style="font-weight:700">Side panel unlocked</span>
      </div>
      <div style="font-size:12px;color:var(--ink-2)">Persistent sidebar — scan while you browse, build collections, download ZIP.</div>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
